name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Lua 5.1 (WoW runtime)
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck and busted
        run: |
          luarocks install luacheck
          luarocks install busted

      - name: luacheck
        # Findings are also emitted as workflow annotations so they are visible
        # without downloading logs.
        run: |
          set -o pipefail
          luacheck . --formatter=plain --codes | tee luacheck.out || {
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/' luacheck.out
            exit 1
          }
          echo "::notice title=luacheck::$(luacheck . --formatter=default --no-color | tail -n 1)"

      - name: busted
        run: |
          set -o pipefail
          busted -o TAP | tee busted.out || {
            grep -A8 '^not ok' busted.out | sed 's/^/::error::/'
            exit 1
          }
          echo "::notice title=busted::ok=$(grep -c '^ok' busted.out) not_ok=$(grep -c '^not ok' busted.out) $(grep -c '# SKIP' busted.out) pending"
